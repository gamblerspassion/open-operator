name: Internet4ALL all-provider ZIP coverage overlay
# Retry after SQLite six-column provider table fix; uses completed source run.
on:
  push:
    branches: [internet4all-national-fcc-20261022]
    paths: [.github/workflows/internet4all-fcc-zcta-overlay.yml]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful 24-shard national H3 run ID"
        required: true
        default: "39843922660"
permissions:
  contents: read
  actions: read
jobs:
  zcta:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Confirm every H3 shard finished successfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          rid=os.environ.get('SOURCE_RUN_ID','39843922660')
          url=f'https://api.github.com/repos/gamblerspassion/open-operator/actions/runs/{rid}'
          for k in range(450):
              q=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f: d=json.load(f)
              print('NATIONAL H3',d['status'],d['conclusion'],flush=True)
              if d['status']=='completed':
                  if d['conclusion']!='success':raise SystemExit('Source H3 extraction failed: '+str(d['conclusion']))
                  break
              time.sleep(20)
          else:raise SystemExit('H3 source did not complete within wait window')
          PY
      - name: Download nationwide all-provider H3 shards
        uses: actions/download-artifact@v4
        with:
          run-id: 39843922660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: internet4all-h3-shard-*
          merge-multiple: true
          path: downloaded/
      - name: Download proven H3 serviceable-location denominators
        uses: actions/download-artifact@v4
        with:
          run-id: 39482148088
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: stance-fcc-h3-denominators
          path: downloaded/
      - run: python3 -m pip install --disable-pip-version-check h3 shapely numpy pyshp
      - name: Merge all provider H3 records into Census ZCTA coverage
        run: python3 scripts/internet4all_fcc_h3_zip_overlay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internet4all-national-all-provider-zcta
          path: zip_results/
          retention-days: 30
          if-no-files-found: warn
