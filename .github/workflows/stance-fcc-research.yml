name: Stance FCC national extraction - isolated
on:
  push:
    branches:
      - stance-fcc-national-research-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stance_fcc_national_extract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stance-fcc-2025-national-provider-coverage
          path: out/
          retention-days: 14
