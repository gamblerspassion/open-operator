name: Stance ZIP state county geographic lookup
on:
  push:
    branches: [stance-fcc-national-research-20261020]
permissions:
  contents: read
jobs:
  geography:
    if: ${{ contains(github.event.head_commit.message, '[geo]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stance_geo_crosswalk.py
      - uses: actions/upload-artifact@v4
        with:
          name: stance-zcta-county-geography
          path: geo_out/
          retention-days: 7
